name = "tag-pipeline-api"
main = "src/index.js"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put` or Cloudflare dashboard):
#   TEAMS_WEBHOOK_URL   — Teams incoming webhook URL
#   GROQ_API_KEY        — Groq API key
#   SAM_API_KEY         — SAM.gov public API key (expires every 90 days)
#                         Rotate: wrangler secret put SAM_API_KEY
#   WORKBOOK_ID         — SharePoint workbook item ID (same as VITE_ONEDRIVE_FILE_ID)
#                         Add: wrangler secret put WORKBOOK_ID
#   MS_TENANT_ID        — Azure AD tenant ID (already set)
#   MS_CLIENT_ID        — App registration client ID (already set)
#   MS_CLIENT_SECRET    — App registration client secret (already set)
#   CAPABILITIES_FILE_ID — Optional Graph driveItem ID for the AI capabilities DOCX
#   DRIVE_ID             — Optional only when that DOCX is in a different document library;
#                          the workbook library is the default.
#   EBUY_CREDENTIAL_ENCRYPTION_KEY — 32 random bytes encoded as base64. Encrypts
#                          the company eBuy username, password, authenticator
#                          setup key, and short-lived session before D1 storage.
#   TRANSACTION_CODING_ALLOWED_USERS — Comma-separated approved Entra object IDs
#                          or user principal names. Transaction Coding fails
#                          closed when this setting is absent.

# KV namespace for caching (AI conversation history + SAM key status)
[[kv_namespaces]]
binding = "CACHE"
id = "8e2b634e99384d5d9e9c0880fce935b0"

# Durable metadata and search index for the GSA eBuy archive. Wrangler can
# resolve this binding by database name after the one-time D1 creation step.
[[d1_databases]]
binding = "EBUY_DB"
database_name = "tag-pipeline-ebuy"
migrations_dir = "migrations"

[[workflows]]
name = "sam-opportunity-pull"
binding = "SAM_PULL_WORKFLOW"
class_name = "SAMPullWorkflow"

[[workflows]]
name = "sam-expiring-contracts"
binding = "EXPIRING_CONTRACTS_WORKFLOW"
class_name = "ExpiringContractsWorkflow"

[[workflows]]
name = "ebuy-opportunity-sync"
binding = "EBUY_SYNC_WORKFLOW"
class_name = "EbuySyncWorkflow"

[[workflows]]
name = "opportunity-sharepoint-workspace"
binding = "OPPORTUNITY_WORKSPACE_WORKFLOW"
class_name = "OpportunityWorkspaceWorkflow"

[[workflows]]
name = "sam-opportunity-archive"
binding = "SAM_ARCHIVE_WORKFLOW"
class_name = "SAMArchiveWorkflow"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://the-avery-group.github.io"

[triggers]
# All cron schedules are UTC. 12:00 UTC is 1:00 PM Nigeria time (WAT).
# - eBuy and SAM opportunity synchronization: 00:00, 06:00, 12:00, and
#   18:00 UTC on weekdays only
# - SAM change checks: 00:00 and 12:00 UTC every day
# - Expiring contract refresh: Monday and Thursday at 00:00 UTC (1:00 AM WAT)
# - RFI follow-up monitor: Monday, Wednesday, Friday at 1:00 PM WAT
# - Capability document eTag checks: every day at 1:01 PM WAT
# - Teams reminders: every day at 2:01 PM WAT, so weekend RFI response
#   reminders remain active while the other reminder categories defer to Monday.
crons = ["0 0,6,12,18 * * *", "1 12 * * *", "1 13 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
# Keep application logs and genuine uncaught exceptions, but omit Cloudflare's
# generic per-invocation records. Workflow health is reported through the
# structured logs emitted by the workflow and its durable instance status.
invocation_logs = false
