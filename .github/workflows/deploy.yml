name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: github-pages-production
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 7 requires Node 20.19+ (or Node 22.12+).
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Verify and build
        env:
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}
          VITE_ONEDRIVE_FILE_ID: ${{ secrets.VITE_ONEDRIVE_FILE_ID }}
          VITE_APP_BASE_URL: ${{ secrets.VITE_APP_BASE_URL }}
          # Worker URL — all API calls (notifications, AI) go through this
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Google Programmable Search Engine ID for public LinkedIn profile results
          VITE_GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.VITE_GOOGLE_SEARCH_ENGINE_ID }}
          # Public configuration value for the default follow-up sender.
          VITE_PROCUREMENT_EMAIL: ${{ vars.VITE_PROCUREMENT_EMAIL }}
          # NOTE: VITE_TEAMS_WEBHOOK_URL and VITE_GROQ_API_KEY have been moved
          # to Cloudflare Worker secrets. Remove them from GitHub secrets
          # once the Worker is deployed and confirmed working.
        run: npm run check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
