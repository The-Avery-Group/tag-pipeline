name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 7 requires Node 20.19+ (or Node 22.12+).
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}
          VITE_ONEDRIVE_FILE_ID: ${{ secrets.VITE_ONEDRIVE_FILE_ID }}
          VITE_APP_BASE_URL: ${{ secrets.VITE_APP_BASE_URL }}
          # Worker URL — all API calls (notifications, AI) go through this
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # SAM.gov manual trigger secret — sent as X-Trigger-Secret header to POST /sam/trigger
          VITE_SAM_TRIGGER_SECRET: ${{ secrets.VITE_SAM_TRIGGER_SECRET }}
          # NOTE: VITE_TEAMS_WEBHOOK_URL and VITE_GROQ_API_KEY have been moved
          # to Cloudflare Worker secrets. Remove them from GitHub secrets
          # once the Worker is deployed and confirmed working.
        run: npm run build

      - name: Check built env vars
        run: grep -r "the-avery-group" dist/ | head -20

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
